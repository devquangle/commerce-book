spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecom_store_book
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            "[trust]": smtp.gmail.com
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.web: DEBUG
    com.fpt.java.controllers: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  gemini:
    api-key: ${GEMINI_API_KEY}
  google:
    books:
      api-key: ${GOOGLE_BOOK_API_KEY}
  searchapi:
    api-key: ${SEARCH_API_KEY}
    url: ${URL_SEARCH_API}
  ghn:
    token: ${GHN_TOKEN}
    shop-id: ${GHN_SHOP_ID}
    master-data-url: ${GHN_MASTER_DATA_URL}
    shipping-fee-url: ${GHN_SHIPPING_FEE_URL}